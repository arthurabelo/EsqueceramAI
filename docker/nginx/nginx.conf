server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend estático (pasta ./frontend montada em read-only)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso da API para o serviço "api" da rede padrão do Compose.
    # Mantém o frontend e a API na mesma origem (http://localhost:8080),
    # evitando problemas de CORS no ambiente local.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
